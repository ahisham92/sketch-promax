# Publishes Sketch ProMax as a GitHub Release whenever main carries a version that has no release yet.
# To ship an update: bump <Version> in both project files and push to main.
# Installed copies of the add-in check the latest release when Revit starts and update themselves.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version and check for an existing release
        id: version
        shell: pwsh
        run: |
          $addin = ([xml](Get-Content src/SketchProMax/SketchProMax.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $mcp = ([xml](Get-Content src/SketchProMax.Mcp/SketchProMax.Mcp.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($addin -ne $mcp) { throw "Version mismatch: add-in $addin, connector $mcp" }
          "version=$addin" >> $env:GITHUB_OUTPUT
          gh release view "v$addin" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release v$addin already exists; nothing to publish."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build add-in (2024 to 2027) and connector
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: .\build.ps1

      - name: Test the tools without Revit (catalogue, schemas, self-test coverage, helpers)
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: dotnet run --project tests/SketchProMax.Tests -c Release -- --addin dist/Revit2025

      - name: Package
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $pkg = "package\SketchProMax"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item dist $pkg -Recurse
          # Every Revit build must carry the loader the manifest names, or installed copies couldn't update in place.
          foreach ($v in 2024, 2025, 2026, 2027) {
            foreach ($f in "SketchProMax.dll", "SketchProMax.Loader.dll", "SketchProMax.addin", "UglyToad.PdfPig.dll", "SketchProMax.pdfium.dll", "TritoRevit\TritoRevit.dll", "TritoRevit\TritoRevit.addin") {
              if (-not (Test-Path "$pkg\dist\Revit$v\$f")) { throw "Package is missing dist\Revit$v\$f" }
            }
          }
          if ((Select-String -Path "$pkg\dist\Revit2025\SketchProMax.addin" -Pattern "SketchProMax.Loader.LoaderApp" -Quiet) -ne $true) { throw "SketchProMax.addin does not load the loader" }
          Get-ChildItem $pkg -Recurse -Filter *.pdb | Remove-Item
          Copy-Item install.ps1, Install.cmd, README.md $pkg
          Compress-Archive -Path $pkg -DestinationPath "SketchProMax-${{ steps.version.outputs.version }}.zip"

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $notes = @"
          **Install:** extract the zip and double-click Install.cmd, or open PowerShell and paste this line (no .cmd needed):

          ``````
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/get.ps1 | iex
          ``````

          If Install.cmd says Windows cannot access the file: Properties > Unblock on the zip, or use the PowerShell line. Installed copies update themselves.
          "@
          # A version's own words (such as "restart Revit once"), when docs/release-notes/<version>.md exists, come first:
          # the in-app notice shows the notes' top lines.
          $own = "docs/release-notes/$v.md"
          if (Test-Path $own) { $notes = (Get-Content $own -Raw).Trim() + "`n`n" + $notes }
          gh release create "v$v" "SketchProMax-$v.zip" --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Sketch ProMax $v" --generate-notes --notes $notes

      - name: Keep the package (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SketchProMax-${{ steps.version.outputs.version }}
          path: SketchProMax-*.zip
