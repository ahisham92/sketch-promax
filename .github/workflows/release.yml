# Builds Sketch ProMax on Windows and publishes it as a GitHub Release when a version tag (v0.6.0, ...) is pushed.
# Installed copies of the add-in check the latest release when Revit starts and update themselves.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Check the tag matches the project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $version = ([xml](Get-Content src/SketchProMax/SketchProMax.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($tag -ne $version) { throw "Tag $tag does not match <Version>$version</Version> in SketchProMax.csproj" }

      - name: Build add-in (2024, 2025, 2026) and connector
        shell: pwsh
        run: .\build.ps1

      - name: Package
        shell: pwsh
        run: |
          $version = ([xml](Get-Content src/SketchProMax/SketchProMax.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $pkg = "package\SketchProMax"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item dist $pkg -Recurse
          Get-ChildItem $pkg -Recurse -Filter *.pdb | Remove-Item
          Copy-Item install.ps1, Install.cmd, README.md $pkg
          Compress-Archive -Path $pkg -DestinationPath "SketchProMax-$version.zip"
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "SketchProMax-$env:VERSION.zip" --title "Sketch ProMax $env:VERSION" --generate-notes

      - name: Keep the package (manual runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: SketchProMax-${{ env.VERSION }}
          path: SketchProMax-*.zip
