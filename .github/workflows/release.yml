# Publishes Sketch ProMax as a GitHub Release whenever main carries a version that has no release yet.
# To ship an update: bump <Version> in both project files and push to main.
# Installed copies of the add-in check the latest release when Revit starts and update themselves.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the last release's tag, to see whether the connector's code changed since

      - name: Read version and check for an existing release
        id: version
        shell: pwsh
        run: |
          $addin = ([xml](Get-Content src/SketchProMax/SketchProMax.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          $mcp = ([xml](Get-Content src/SketchProMax.Mcp/SketchProMax.Mcp.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ($addin -ne $mcp) { throw "Version mismatch: add-in $addin, connector $mcp" }
          "version=$addin" >> $env:GITHUB_OUTPUT
          # Only a published release counts: a draft left by a failed upload is finished by the Publish step.
          $draft = gh release view "v$addin" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2> $null
          if ($LASTEXITCODE -eq 0 -and $draft -eq "false") {
            Write-Host "Release v$addin already exists; nothing to publish."
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }
          exit 0

      - uses: actions/setup-dotnet@v4
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build add-in (2024 to 2027) and connector
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: .\build.ps1

      - name: Test the tools without Revit (catalogue, schemas, self-test coverage, helpers)
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        run: dotnet run --project tests/SketchProMax.Tests -c Release -- --addin dist/Revit2025

      - name: Package
        if: steps.version.outputs.exists == 'false' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          $pkg = "package\SketchProMax"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item dist $pkg -Recurse
          # The desktop-app connector is the biggest file (about 30 MB compressed). When its code hasn't changed since the
          # last release, that release's exact exe is reused, so changed-files updates don't download it again.
          try {
            $prev = gh release view --repo "${{ github.repository }}" --json tagName -q .tagName
            $csproj = "src/SketchProMax.Mcp/SketchProMax.Mcp.csproj"
            $others = @(git ls-files src/SketchProMax.Mcp | Where-Object { $_ -ne $csproj }) + "build.ps1" +
              @(([xml](git show "HEAD:$csproj" | Out-String)).Project.ItemGroup.Compile.Include | Where-Object { $_ } |
                ForEach-Object { "src/" + $_.Replace('..\', '').Replace('\', '/') })
            $noVersion = { param($rev) (git show "${rev}:$csproj" | Where-Object { $_ -notmatch '<Version>' }) -join "`n" }
            git diff --quiet $prev HEAD -- @others
            $same = $LASTEXITCODE -eq 0 -and (& $noVersion $prev) -eq (& $noVersion "HEAD")
            if ($same) {
              New-Item -ItemType Directory -Force prevrel | Out-Null
              gh release download $prev --repo "${{ github.repository }}" --pattern "*.files.json" -D prevrel --clobber
              $entry = (Get-Content (Get-ChildItem prevrel\*.files.json).FullName -Raw | ConvertFrom-Json).files | Where-Object { $_.path -eq "mcp/SketchProMax.Mcp.exe" }
              if (-not $entry) { throw "the last release lists no connector" }
              gh release download $prev --repo "${{ github.repository }}" --pattern "$($entry.sha256).gz" -D prevrel --clobber
              $in = [IO.File]::OpenRead((Resolve-Path "prevrel\$($entry.sha256).gz").Path); $out = [IO.File]::Create("prevrel\SketchProMax.Mcp.exe")
              $z = New-Object IO.Compression.GZipStream($in, [IO.Compression.CompressionMode]::Decompress)
              $z.CopyTo($out); $z.Dispose(); $out.Dispose(); $in.Dispose()
              if ((Get-FileHash prevrel\SketchProMax.Mcp.exe -Algorithm SHA256).Hash -ne $entry.sha256.ToUpperInvariant()) { throw "checksum mismatch" }
              Copy-Item prevrel\SketchProMax.Mcp.exe "$pkg\dist\mcp\SketchProMax.Mcp.exe" -Force
              Write-Host "Connector unchanged since ${prev}: reusing its SketchProMax.Mcp.exe"
            } else { Write-Host "Connector code changed since $prev (or no earlier release): using the new build" }
          } catch { Write-Host "Could not reuse the last release's connector, using the new build: $_" }
          $global:LASTEXITCODE = 0
          # Every Revit build must carry the loader the manifest names, or installed copies couldn't update in place.
          foreach ($v in 2024, 2025, 2026, 2027) {
            foreach ($f in "SketchProMax.dll", "SketchProMax.Loader.dll", "SketchProMax.addin", "UglyToad.PdfPig.dll", "SketchProMax.pdfium.dll", "TritoRevit\TritoRevit.dll", "TritoRevit\TritoRevit.addin") {
              if (-not (Test-Path "$pkg\dist\Revit$v\$f")) { throw "Package is missing dist\Revit$v\$f" }
            }
          }
          if ((Select-String -Path "$pkg\dist\Revit2025\SketchProMax.addin" -Pattern "SketchProMax.Loader.LoaderApp" -Quiet) -ne $true) { throw "SketchProMax.addin does not load the loader" }
          Get-ChildItem $pkg -Recurse -Filter *.pdb | Remove-Item
          Copy-Item install.ps1, Install.cmd, README.md $pkg
          Compress-Archive -Path $pkg -DestinationPath "SketchProMax-${{ steps.version.outputs.version }}.zip"
          # Changed-files updates: a list of every dist file (path, size, SHA-256) and each file gzipped under its hash.
          # Installed copies reuse their unchanged files and download only the rest (Update/DeltaUpdate.cs).
          $v = "${{ steps.version.outputs.version }}"
          $dist = (Resolve-Path "$pkg\dist").Path
          New-Item -ItemType Directory -Force delta | Out-Null
          $files = foreach ($f in Get-ChildItem $dist -Recurse -File) {
            $sha = (Get-FileHash $f.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            $gz = "delta\$sha.gz"
            if (-not (Test-Path $gz)) {
              $in = [IO.File]::OpenRead($f.FullName); $out = [IO.File]::Create($gz)
              $z = New-Object IO.Compression.GZipStream($out, [IO.Compression.CompressionLevel]::Optimal)
              $in.CopyTo($z); $z.Dispose(); $out.Dispose(); $in.Dispose()
            }
            [ordered]@{ path = $f.FullName.Substring($dist.Length + 1).Replace('\', '/'); size = $f.Length; sha256 = $sha }
          }
          [ordered]@{ version = $v; files = @($files) } | ConvertTo-Json -Depth 4 | Set-Content "SketchProMax-$v.files.json" -Encoding utf8
          Write-Host "Changed-files update: $(@($files).Count) files, $((Get-ChildItem delta\*.gz).Count) unique"

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: |
          $v = "${{ steps.version.outputs.version }}"
          $notes = @"
          **Install:** extract the zip and double-click Install.cmd, or open PowerShell and paste this line (no .cmd needed):

          ``````
          irm https://raw.githubusercontent.com/${{ github.repository }}/main/get.ps1 | iex
          ``````

          If Install.cmd says Windows cannot access the file: Properties > Unblock on the zip, or use the PowerShell line. Installed copies update themselves.
          "@
          # A version's own words (such as "restart Revit once"), when docs/release-notes/<version>.md exists, come first:
          # the in-app notice shows the notes' top lines.
          $own = "docs/release-notes/$v.md"
          if (Test-Path $own) { $notes = (Get-Content $own -Raw).Trim() + "`n`n" + $notes }
          $assets = @("SketchProMax-$v.zip", "SketchProMax-$v.files.json") + (Get-ChildItem delta\*.gz).FullName
          # GitHub's upload service sometimes fails one file (502, or a retried upload that already landed), so the
          # release starts as a draft, each file is uploaded with retries, and it is published only when all are there.
          $repo = "${{ github.repository }}"
          gh release view "v$v" --repo $repo *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create "v$v" --draft --repo $repo --target "${{ github.sha }}" --title "Sketch ProMax $v" --generate-notes --notes $notes
            if ($LASTEXITCODE -ne 0) { throw "Could not create the draft release" }
          }
          foreach ($a in $assets) {
            $ok = $false
            for ($i = 1; $i -le 5 -and -not $ok; $i++) {
              gh release upload "v$v" $a --clobber --repo $repo
              $ok = $LASTEXITCODE -eq 0
              if (-not $ok) { Write-Host "Upload of $a failed (try $i), retrying"; Start-Sleep -Seconds (10 * $i) }
            }
            if (-not $ok) { throw "Could not upload $a" }
          }
          gh release edit "v$v" --repo $repo --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Could not publish the release" }

      - name: Keep the package (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: SketchProMax-${{ steps.version.outputs.version }}
          path: SketchProMax-*.zip
